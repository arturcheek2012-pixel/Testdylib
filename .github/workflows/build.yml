name: Build firmware
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project (unzips automatically if the repo contains only the .zip)
        run: |
          set -e
          P=$(find . -name platformio.ini -not -path './.git/*' | head -1)
          if [ -z "$P" ]; then
            Z=$(find . -name '*.zip' -not -path './.git/*' | head -1)
            [ -n "$Z" ] || { echo "ERROR: no platformio.ini and no .zip in the repository"; exit 1; }
            echo "Unzipping $Z"
            mkdir -p /tmp/proj
            unzip -q "$Z" -d /tmp/proj
            P=$(find /tmp/proj -name platformio.ini | head -1)
            [ -n "$P" ] || { echo "ERROR: platformio.ini not found inside the zip"; exit 1; }
          fi
          echo "PROJ=$(cd "$(dirname "$P")" && pwd)" >> "$GITHUB_ENV"
          echo "Project directory: $(dirname "$P")"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio "esptool<5"

      - name: Install IRremoteESP8266 (tries several sources until one works)
        run: |
          OK=0
          for L in "IRremoteESP8266" "crankyoncoder/IRremoteESP8266" \
                   "https://github.com/markszabo/IRremoteESP8266/archive/refs/tags/v2.8.6.zip" \
                   "https://github.com/crankyoncoder/IRremoteESP8266/archive/refs/tags/v2.8.6.zip"; do
            echo "=== trying: $L"
            if pio pkg install --global --library "$L"; then OK=1; echo "installed from: $L"; break; fi
          done
          [ "$OK" = 1 ] || { echo "ERROR: could not install IRremoteESP8266 from any source"; exit 1; }
          # the library now comes from the global storage, so drop it from this project's lib_deps
          sed -i '/IRremoteESP8266/d' "$PROJ/platformio.ini"
          pio pkg list --global | head -20

      - name: Build
        run: |
          cd "$PROJ"
          pio run -e esp32dev
          ls -l .pio/build/esp32dev/*.bin

      - name: Collect binaries
        run: |
          mkdir -p /tmp/out
          B="$PROJ/.pio/build/esp32dev"
          cp "$B/firmware.bin" "$B/bootloader.bin" "$B/partitions.bin" /tmp/out/
          BOOT=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -1)
          python -m esptool --chip esp32 merge_bin -o /tmp/out/firmware_merged.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 "$B/bootloader.bin" 0x8000 "$B/partitions.bin" 0xe000 "$BOOT" 0x10000 "$B/firmware.bin" \
            || echo "merge step failed (firmware.bin is still valid)"
          ls -l /tmp/out

      - uses: actions/upload-artifact@v4
        with:
          name: tv-remote-firmware
          path: /tmp/out/*
