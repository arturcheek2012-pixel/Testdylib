name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Скачать эмулятор v86 в приложение
        run: |
          mkdir -p App/Resources/v86 App/Sources
          B=https://cdn.jsdelivr.net/npm/v86@latest/build
          G=https://cdn.jsdelivr.net/gh/copy/v86@master/bios
          curl -fL "$B/libv86.js" -o App/Resources/v86/libv86.js
          curl -fL "$B/v86.wasm" -o App/Resources/v86/v86.wasm
          curl -fL "$G/seabios.bin" -o App/Resources/v86/seabios.bin
          curl -fL "$G/vgabios.bin" -o App/Resources/v86/vgabios.bin
          cp index.html App/Resources/index.html
          ls -la App/Resources/v86

      - name: AppDelegate
        run: |
          cat > App/Sources/AppDelegate.swift <<'EOF'
          import UIKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication,
                               didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = ViewController()
                  window?.makeKeyAndVisible()
                  application.isIdleTimerDisabled = true   // экран не гаснет, пока идёт эмуляция
                  return true
              }
          }
          EOF

      - name: ViewController
        run: |
          cat > App/Sources/ViewController.swift <<'EOF'
          import UIKit
          import WebKit

          // Отдаёт файлы из приложения по адресу app://localhost/...
          final class BundleSchemeHandler: NSObject, WKURLSchemeHandler {
              func webView(_ webView: WKWebView, start task: WKURLSchemeTask) {
                  guard let url = task.request.url else { return }
                  var path = url.path
                  if path.isEmpty || path == "/" { path = "/index.html" }
                  let rel = String(path.dropFirst())
                  let base = Bundle.main.resourceURL!.appendingPathComponent("Resources")
                  let fileURL = base.appendingPathComponent(rel)

                  guard let data = try? Data(contentsOf: fileURL) else {
                      let r = HTTPURLResponse(url: url, statusCode: 404, httpVersion: "HTTP/1.1",
                                              headerFields: ["Access-Control-Allow-Origin": "*"])!
                      task.didReceive(r); task.didFinish(); return
                  }
                  let mime: String
                  switch fileURL.pathExtension.lowercased() {
                  case "html": mime = "text/html; charset=utf-8"
                  case "js":   mime = "application/javascript"
                  case "wasm": mime = "application/wasm"
                  default:     mime = "application/octet-stream"
                  }
                  let r = HTTPURLResponse(url: url, statusCode: 200, httpVersion: "HTTP/1.1",
                                          headerFields: ["Content-Type": mime,
                                                         "Content-Length": "\(data.count)",
                                                         "Access-Control-Allow-Origin": "*"])!
                  task.didReceive(r); task.didReceive(data); task.didFinish()
              }
              func webView(_ webView: WKWebView, stop task: WKURLSchemeTask) {}
          }

          final class ViewController: UIViewController, WKNavigationDelegate, WKUIDelegate {
              var web: WKWebView!
              let bg = UIColor(red: 0.043, green: 0.043, blue: 0.051, alpha: 1)

              override func loadView() {
                  let cfg = WKWebViewConfiguration()
                  cfg.setURLSchemeHandler(BundleSchemeHandler(), forURLScheme: "app")
                  cfg.allowsInlineMediaPlayback = true
                  cfg.websiteDataStore = WKWebsiteDataStore.default()
                  web = WKWebView(frame: .zero, configuration: cfg)
                  web.navigationDelegate = self
                  web.uiDelegate = self
                  web.scrollView.bounces = false
                  web.scrollView.contentInsetAdjustmentBehavior = .never
                  web.isOpaque = false
                  web.backgroundColor = bg
                  web.scrollView.backgroundColor = bg
                  view = web
              }

              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = bg
                  web.load(URLRequest(url: URL(string: "app://localhost/index.html")!))
              }

              // если iOS убил процесс страницы из-за памяти, просто перезагружаем её
              func webViewWebContentProcessDidTerminate(_ webView: WKWebView) {
                  web.load(URLRequest(url: URL(string: "app://localhost/index.html")!))
              }

              override var prefersStatusBarHidden: Bool { true }
              override var prefersHomeIndicatorAutoHidden: Bool { true }
              override var supportedInterfaceOrientations: UIInterfaceOrientationMask { .all }
          }
          EOF

      - name: Проект Xcode
        run: |
          cat > project.yml <<'EOF'
          name: AndroidBox
          options:
            bundleIdPrefix: com.local
            deploymentTarget:
              iOS: "15.0"
          targets:
            AndroidBox:
              type: application
              platform: iOS
              sources:
                - path: App/Sources
                - path: App/Resources
                  type: folder
                  buildPhase: resources
              info:
                path: App/Info.plist
                properties:
                  CFBundleDisplayName: Android
                  UILaunchScreen: {}
                  UIStatusBarHidden: true
                  UIRequiresFullScreen: true
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.local.androidbox
                  SWIFT_VERSION: "5.0"
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGN_IDENTITY: ""
          EOF

      - name: Сборка
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project AndroidBox.xcodeproj -scheme AndroidBox \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AndroidBox.app Payload/
          zip -qry AndroidBox.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AndroidBox-ipa
          path: AndroidBox.ipa
